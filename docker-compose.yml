version: '3.8'

services:
  backend:
    build: .
    container_name: my-flask-api
    ports:
      - "5000:5000"  
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}  
    ports:
      - "5432:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: 